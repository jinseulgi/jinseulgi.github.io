<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="진슬기 개인 소개 페이지">
  <title>진슬기 | Personal Profile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <a class="mark" href="index.html" aria-label="처음으로">JS<span>.</span></a>
      <span class="header-label">PERSONAL PROFILE / 2026</span>

    <!-- 아래 이름, 소속, 한줄소개를 원하는 글자로 바꾸세요. -->
    <section class="intro" aria-labelledby="profile-name">
      <p class="eyebrow">DESIGN CONVERGENCE</p>
      <h1 id="profile-name">진슬기</h1>
      <p class="affiliation">국립공주대학교 디자인컨버전스학과</p>
      <p class="one-line">(나를 소개하는 한 문장을 입력하세요.)</p>
    </section>

    <section class="details" aria-label="프로필 상세 정보">
      <article class="detail-block">
        <p class="detail-label">INTEREST</p>
        <!-- 관심 분야를 입력하세요. -->
        <h2>관심 분야</h2>
        <p class="detail-text">(추후 입력)</p>
      </article>

      <article class="detail-block">
        <p class="detail-label">CLASS</p>
        <h2>미래첨단기술의 이해 I</h2>
      </article>
    </section>

    <footer class="site-footer">
      <span>© 2026 진슬기</span>
      <span>PERSONAL PROFILE</span>
    </footer>
  </main>

</html>
