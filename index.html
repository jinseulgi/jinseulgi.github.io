<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Image AR</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
/*- CSS -*/
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      overflow: hidden;
      font-family: sans-serif;
    }

    #container {
      width: 100vw;
      height: 100dvh;
      position: relative;
    }

    #status {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      color: white;
      background: #222c;
      border-radius: 20px;
      font-size: 13px;
      white-space: nowrap;
      pointer-events: none;
    }

    #touchArea {
      position: fixed;
      inset: 0;
      z-index: 5;
      touch-action: none;
      background: transparent;
    }

    #startButton {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      padding: 16px 26px;
      border: 0;
      border-radius: 12px;
      background: white;
      font-size: 17px;
    }

    #soundButton {
      display: none;
      position: fixed;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 16;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: white;
      color: #222;
      font-size: 14px;
      font-weight: bold;
      touch-action: manipulation;
    }

    #controls {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      z-index: 15;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    #controls button {
      padding: 10px 16px;
      border: 0;
      border-radius: 20px;
      background: #000;
      color: white;
      font-size: 13px;
      white-space: nowrap;
      touch-action: manipulation;
    }
  </style>
</head>

<body>

  <div id="container"></div>
  <div id="touchArea"></div>

  <div id="status">AR 준비 중...</div>

  <button id="startButton">카메라 시작</button>
  <button id="soundButton">소리 켜기</button>

  <div id="controls">
    <button id="reset">초기화</button>
  </div>

  <script type="module">

    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
    import { MindARThree } from "mindar-image-three";

    const status = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const soundButton = document.getElementById("soundButton");
    const touchArea = document.getElementById("touchArea");


    // AR 초기 설정
    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
      imageTargetSrc: "./targets.mind",
      maxTrack: 1
    });

    const { renderer, scene, camera } = mindarThree;
    const anchor = mindarThree.addAnchor(0);

    // 위치 이동용 그룹(대상별로 분리)
    // 3D 모델은 modelMoveGroup, 영상은 backgroundMoveGroup, 이미지는 imageMoveGroup에 넣고
    // 두 손가락이 닿은 대상의 위치변경
    const modelMoveGroup = new THREE.Group();
    const backgroundMoveGroup = new THREE.Group();
    const imageMoveGroup = new THREE.Group();
    anchor.group.add(modelMoveGroup);
    anchor.group.add(backgroundMoveGroup);
    anchor.group.add(imageMoveGroup);

    // 이미지의 기본(초기화) 위치: 영상 아래쪽
    const imageHome = new THREE.Vector3(0, 0, 0);

    // 조명
    scene.add(
      new THREE.HemisphereLight(0xffffff, 0x444444, 1.5)
    ); 
    // 환경라이트, 수치가 밝기
    const directionalLight = new THREE.DirectionalLight(
      0xffffff, 2
    );
    
    directionalLight.position.set(1, 2, 3);
    scene.add(directionalLight);

    // 콘텐츠 설정
    const TARGET_MODEL_SIZE = 1.00;
    const MODEL_HEIGHT_OFFSET = 0.03;
    // 콘텐츠 urls
    const VIDEO_FILE = "./background.mp4";
    const IMAGE_FILE = "./background.jpg";
    const MODEL_FILE = "./model.glb";

    // 영상과 이미지 사이 간격 (마커 가로 길이 1 기준)
    // 영상 아래에 재생바 0.15
    const IMAGE_GAP = 0.15;

    // 영상 재생바 (마커 가로 길이 1 기준, 영상 가로 길이와 같은 길이)
    const VIDEO_BAR_HEIGHT = 0.025;      // 바 두께
    const VIDEO_BAR_HIT_HEIGHT = 0.10;   // 터치로 잡을 수 있는 영역 두께
    const VIDEO_BAR_OFFSET = 0.05;       // 영상과 바 중심까지 거리

    let modelRoot = null;
    let initialFitScale = 1;

    let video = null;
    let videoTexture = null;
    let videoReady = false;
    let videoFailed = false;
    let videoLoadTimer = null;
    let soundEnabled = false;

    let backgroundMesh = null;
    let backgroundTexture = null;
    let imageRequested = false;

    // 이미지 
    let imageMesh = null;
    let imageTexture = null;

    // 영상 재생바
    let videoBar = null;
    let targetVisible = false;
    let started = false;
    let starting = false;

    const loader = new GLTFLoader();


    // 상태 표시
    function updateStatus() {

      if (!started) {
        status.textContent = "카메라 대기 중";
      } else if (targetVisible) {
        status.textContent = "마커 인식 완료";
      } else {
        status.textContent = "마커를 카메라에 비춰주세요";
      }

    }


    // 기존 배경 제거
    function clearBackground() {

      // 영상이 사라지면 재생바도 같이 제거
      removeVideoBar();

      if (backgroundMesh) {

        backgroundMoveGroup.remove(backgroundMesh);

        backgroundMesh.geometry.dispose();
        backgroundMesh.material.dispose();

        backgroundMesh = null;

      }

      if (backgroundTexture) {

        backgroundTexture.dispose();
        backgroundTexture = null;

      }

    }

    // 배경 이미지 / 영상 표시
    function addBackground(texture, mediaWidth, mediaHeight) {

      if (
        !mediaWidth ||
        !mediaHeight ||
        !Number.isFinite(mediaWidth) ||
        !Number.isFinite(mediaHeight)
      ) {
        texture.dispose();
        return;
      }

      // 기존 배경이 있다면 제거
      clearBackground();

      // 실제 미디어 가로세로 비율
      const ratio = mediaHeight / mediaWidth;

      const geometry = new THREE.PlaneGeometry(
        1,
        ratio
      );

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(
        geometry,
        material
      );

      plane.position.set(0, 0, 0);
      plane.renderOrder = 0;

      backgroundMoveGroup.add(plane);

      backgroundMesh = plane;
      backgroundTexture = texture;

      // 영상 바로 아래에 재생바 생성
      createVideoBar(ratio);

      // 영상 크기가 정해졌으므로 이미지 기본 위치 다시 계산
      updateImageHome();

    }


    // 영상 재생바 생성 / 제거 / 진행 갱신
    function createVideoBar(videoRatio) {
      removeVideoBar();
      const group = new THREE.Group();
      group.position.set(
        0,
        -(videoRatio / 2 + VIDEO_BAR_OFFSET),
        0.001
      );

      // 바 배경
      const track = new THREE.Mesh(
        new THREE.PlaneGeometry(1, VIDEO_BAR_HEIGHT),
        new THREE.MeshBasicMaterial({
          color: 0x000000,
          transparent: true,
          opacity: 0.5,
          side: THREE.DoubleSide
        })
      );

      track.renderOrder = 1;

      // 진행 표시
      const fill = new THREE.Mesh(
        new THREE.PlaneGeometry(1, VIDEO_BAR_HEIGHT),
        new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide
        })
      );

      fill.position.set(-0.5, 0, 0.001);
      fill.scale.x = 0.0001;
      fill.renderOrder = 2;

      // 터치 영역 (투명)
      const hit = new THREE.Mesh(
        new THREE.PlaneGeometry(1, VIDEO_BAR_HIT_HEIGHT),
        new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          depthWrite: false,
          side: THREE.DoubleSide
        })
      );

      hit.position.z = 0.002;

      group.add(hit);
      group.add(track);
      group.add(fill);

      backgroundMoveGroup.add(group);

      videoBar = { group, track, fill, hit };

    }

    function removeVideoBar() {

      if (!videoBar) return;

      backgroundMoveGroup.remove(videoBar.group);

      [videoBar.track, videoBar.fill, videoBar.hit].forEach((mesh) => {
        mesh.geometry.dispose();
        mesh.material.dispose();
      });

      videoBar = null;

    }

    function updateVideoBar() {

      if (
        !videoBar ||
        !video ||
        !Number.isFinite(video.duration) ||
        video.duration <= 0
      ) {
        return;
      }

      const progress = THREE.MathUtils.clamp(
        video.currentTime / video.duration,
        0,
        1
      );

      videoBar.fill.scale.x = Math.max(progress, 0.0001);
      videoBar.fill.position.x = -0.5 + progress / 2;

    }


    // 이미지 기본 위치 계산
    function updateImageHome() {

      let homeY = 0;

      if (backgroundMesh && imageMesh) {

        const videoHalfHeight =
          backgroundMesh.geometry.parameters.height / 2;

        const imageHalfHeight =
          imageMesh.geometry.parameters.height / 2;

        homeY = -(videoHalfHeight + imageHalfHeight + IMAGE_GAP);

      }

      const diffY = homeY - imageHome.y;
      imageHome.y = homeY;
      imageMoveGroup.position.y += diffY;

    }

    // 이미지 표시 (영상과 별개로 표시)
    function addImage(texture, mediaWidth, mediaHeight) {

      if (
        !mediaWidth ||
        !mediaHeight ||
        !Number.isFinite(mediaWidth) ||
        !Number.isFinite(mediaHeight)
      ) {
        texture.dispose();
        return;
      }

      const ratio = mediaHeight / mediaWidth;

      const geometry = new THREE.PlaneGeometry(
        1,
        ratio
      );

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.DoubleSide
      });

      const plane = new THREE.Mesh(
        geometry,
        material
      );

      // 영상과 겹쳐도 깜빡이지 않도록 아주 조금 앞에 배치
      plane.position.set(0, 0, 0.002);
      plane.renderOrder = 1;
      imageMoveGroup.add(plane);

      imageMesh = plane;
      imageTexture = texture;

      updateImageHome();

    }

    // 이미지 로딩
    function loadBackgroundImage() {

      if (imageRequested) return;

      imageRequested = true;

      const textureLoader = new THREE.TextureLoader();

      textureLoader.load(

        IMAGE_FILE,

        (texture) => {

          texture.colorSpace = THREE.SRGBColorSpace;

          const image = texture.image;

          // 영상 배경이 아니라 이미지 전용 표시로 변경
          addImage(
            texture,
            image.width,
            image.height
          );

        },

        undefined,

        () => {
          console.log("배경 이미지 로딩 실패");
        }

      );

    }

    // 영상 실패 시 이미지로 전환
    function switchToImage() {

      if (videoFailed) return;

      videoFailed = true;

      if (videoLoadTimer) {
        clearTimeout(videoLoadTimer);
        videoLoadTimer = null;
      }

      if (video) {
        video.pause();
      }

      soundButton.style.display = "none";

      clearBackground();

      // 이미지는 처음부터 항상 표시 중이므로, 영상이 사라진 뒤 이미지 위치만 다시 계산
      updateImageHome();

    }


    // 영상 재생
    function playBackgroundVideo() {

      if (
        !video ||
        !videoReady ||
        videoFailed ||
        !targetVisible
      ) {
        return;
      }

      video.play().catch((error) => {

        console.log("영상 재생 오류:", error);

        // 브라우저의 사용자 조작 요구
        if (error.name === "NotAllowedError") {

          soundButton.textContent = "영상 재생 · 소리 켜기";
          soundButton.style.display = "block";

        } else {

          // 코덱 또는 재생 오류
          switchToImage();

        }

      });

    }

    // 영상 로딩
    function loadBackgroundVideo() {

      video = document.createElement("video");

      video.src = VIDEO_FILE;
      video.loop = true;

      // 자동 재생을 위한 초기 음소거
      // 사용자가 소리 켜기를 누르면 해제
      video.muted = true;
      video.volume = 1;

      video.playsInline = true;
      video.autoplay = false;
      video.preload = "auto";

      video.setAttribute("playsinline", "");
      video.setAttribute("webkit-playsinline", "");

      // 영상 메타데이터 로딩 완료
      video.addEventListener("loadedmetadata", () => {

        if (videoReady || videoFailed) return;

        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;

        if (!videoWidth || !videoHeight) {
          switchToImage();
          return;
        }

        videoReady = true;

        if (videoLoadTimer) {
          clearTimeout(videoLoadTimer);
          videoLoadTimer = null;
        }

        // 영상 텍스처 생성
        videoTexture = new THREE.VideoTexture(video);

        videoTexture.colorSpace = THREE.SRGBColorSpace;

        // 이미지와 달리 영상은 videoWidth / videoHeight 사용
        addBackground(
          videoTexture,
          video.videoWidth,
          video.videoHeight
        );

        if (targetVisible) {

          soundButton.style.display = "block";
          updateSoundButton();

          playBackgroundVideo();

        }

      });

      // 영상 로딩 실패
      video.addEventListener("error", () => {

        switchToImage();

      });

      // 영상 로딩이 너무 오래 걸리면 이미지 사용
      videoLoadTimer = setTimeout(() => {

        if (!videoReady && !videoFailed) {
          switchToImage();
        }

      }, 15000);

      video.load();

    }

    // 영상과 이미지를 동시에 표시
    loadBackgroundVideo();
    loadBackgroundImage();

    // 소리 켜기 / 끄기
    function updateSoundButton() {

      soundButton.textContent = soundEnabled
        ? "소리 끄기"
        : "소리 켜기";

    }

    soundButton.addEventListener("click", async () => {

      if (!video || !videoReady || videoFailed) return;

      soundEnabled = !soundEnabled;

      video.muted = !soundEnabled;

      updateSoundButton();

      if (targetVisible) {

        try {

          await video.play();

        } catch (error) {

          console.log("영상 재생 오류:", error);

          if (error.name !== "NotAllowedError") {
            switchToImage();
          }

        }

      }

    });


    // GLB 3D 모델 로딩
    loader.load(

      MODEL_FILE,

      (gltf) => {

        const model = gltf.scene;

        const box = new THREE.Box3().setFromObject(model);

        const size = new THREE.Vector3();
        const center = new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const maxDimension = Math.max(
          size.x,
          size.y,
          size.z
        );

        if (!Number.isFinite(maxDimension) || maxDimension <= 0) {
          console.log("모델 크기 계산 오류");
          return;
        }

        initialFitScale = TARGET_MODEL_SIZE / maxDimension;

        // 밑면 기준 위치
        model.position.set(
          -center.x,
          -box.min.y,
          -center.z
        );

        // 크기 및 회전 조작 그룹
        modelRoot = new THREE.Group();

        modelRoot.scale.setScalar(initialFitScale);
        modelRoot.add(model);

        // 기존 방향 및 위치 유지
        const orientationGroup = new THREE.Group();

        orientationGroup.rotation.x = Math.PI / 2;
        orientationGroup.position.z = MODEL_HEIGHT_OFFSET;

        orientationGroup.add(modelRoot);

        modelMoveGroup.add(orientationGroup);

      },

      undefined,

      (error) => {
        console.log("GLB 없음 또는 로딩 실패");
      }

    );


    // 마커 인식
    anchor.onTargetFound = () => {

      targetVisible = true;

      if (video && videoReady && !videoFailed) {

        soundButton.style.display = "block";

        updateSoundButton();

        playBackgroundVideo();

      }

      updateStatus();

    };

    anchor.onTargetLost = () => {

      targetVisible = false;

      if (video) {
        video.pause();
      }

      soundButton.style.display = "none";

      updateStatus();

    };


    // 카메라 시작
    async function startAR() {

      if (started || starting) return;

      starting = true;

      status.textContent = "카메라 권한 확인 중...";
      startButton.style.display = "none";

      try {

        await mindarThree.start();

        started = true;
        starting = false;

        renderer.setAnimationLoop(() => {
          updateVideoBar();
          renderer.render(scene, camera);
        });

        updateStatus();

      } catch (error) {

        console.error("AR 시작 오류:", error);

        starting = false;

        status.textContent = "카메라를 시작할 수 없습니다";
        startButton.style.display = "block";

      }

    }

    startAR();

    startButton.addEventListener("click", startAR);


    // 초기화
    document.getElementById("reset").addEventListener("click", () => {

      // 이동한 위치 초기화 (모델/배경 모두, 모델이 없어도 배경 위치는 초기화)
      modelMoveGroup.position.set(0, 0, 0);
      backgroundMoveGroup.position.set(0, 0, 0);

      // 영상 크기도 초기화
      backgroundMoveGroup.scale.set(1, 1, 1);

      // 이미지 위치(영상 아래쪽 기본 위치) 및 크기 초기화
      imageMoveGroup.position.copy(imageHome);
      imageMoveGroup.scale.set(1, 1, 1);

      if (!modelRoot) return;

      modelRoot.scale.setScalar(initialFitScale);
      modelRoot.rotation.set(0, 0, 0);

    });


    // 한 손가락 회전
   // 두 손가락 확대 / 축소 + 위치 이동
    const activePointers = new Map();

    let previousX = 0;
    let previousY = 0;

    let pinchStartDistance = 0;
    let pinchStartScale = 1;

    const ROTATION_SPEED = 0.01;

    // 영상 두드리기(탭) 판정 기준
    const TAP_MOVE_LIMIT = 10;   // px: 이 이상 움직이면 탭이 아님
    const TAP_MAX_TIME = 400;    // ms: 이 시간 안에 손을 떼야 탭

    // 영상 위 드래그 시 재생 위치 이동량
    // 1 = 화면 가로 전체를 드래그하면 영상 전체 길이만큼 이동
    // 0.25 = 화면 가로 전체를 드래그하면 영상 길이의 25%만큼 이동 (값이 작을수록 둔해짐)
    const SEEK_SCREEN_WIDTH_RATIO = 0.25;

    // 한 손가락 터치 상태
    let singleStartTarget = null;   // 터치 시작 지점의 대상 ("model" / "image" / "background" / null)
    let tapCandidate = false;
    let tapStartX = 0;
    let tapStartY = 0;
    let tapStartTime = 0;

    //  재생바 터치 / 드래그 위치로 영상 재생 위치 이동
    // 터치 지점을 마커 평면 좌표로 바꾼 뒤, 영상 그룹의 위치·크기를 빼서
    // 영상 가로 길이 기준 0 ~ 1 진행률로 계산
    const barSeekLocal = new THREE.Vector3();

    function seekVideoFromScreen(clientX, clientY) {

      if (
        !video ||
        !videoReady ||
        videoFailed ||
        !Number.isFinite(video.duration) ||
        video.duration <= 0
      ) {
        return;
      }

      if (!screenToAnchorLocal(clientX, clientY, barSeekLocal)) return;

      const scaleX = backgroundMoveGroup.scale.x;

      if (!scaleX) return;

      const progress = THREE.MathUtils.clamp(
        (barSeekLocal.x - backgroundMoveGroup.position.x) / scaleX + 0.5,
        0,
        1
      );

      video.currentTime = progress * video.duration;

    }

    // 영상 재생 / 일시정지 전환
    function toggleVideoPlayback() {

      if (
        !video ||
        !videoReady ||
        videoFailed ||
        !targetVisible
      ) {
        return;
      }

      if (video.paused) {
        playBackgroundVideo();
      } else {
        video.pause();
      }

    }

    function getPinchDistance() {

      const points = Array.from(activePointers.values());

      if (points.length < 2) return 0;

      const dx = points[0].x - points[1].x;
      const dy = points[0].y - points[1].y;

      return Math.sqrt(dx * dx + dy * dy);

    }

    // 두 손가락 중간점 (화면 좌표)
    function getPinchMidpoint() {

      const points = Array.from(activePointers.values());

      if (points.length < 2) return null;

      return {
        x: (points[0].x + points[1].x) / 2,
        y: (points[0].y + points[1].y) / 2
      };

    }

    // 화면 좌표 -> 마커 
    // 카메라 광선이 마커와 만나는 지점을 사용합니다.
    const dragRaycaster = new THREE.Raycaster();
    const dragPlane = new THREE.Plane();
    const dragNdc = new THREE.Vector2();
    const dragPlaneNormal = new THREE.Vector3();
    const dragPlanePoint = new THREE.Vector3();
    const dragHitPoint = new THREE.Vector3();

    // 화면 좌표에서 카메라 광선 생성
    function setRayFromScreen(clientX, clientY) {

      const rect = renderer.domElement.getBoundingClientRect();

      if (!rect.width || !rect.height) return false;

      dragNdc.set(
        ((clientX - rect.left) / rect.width) * 2 - 1,
        -((clientY - rect.top) / rect.height) * 2 + 1
      );

      camera.updateMatrixWorld();
      camera.projectionMatrixInverse
        .copy(camera.projectionMatrix)
        .invert();

      dragRaycaster.setFromCamera(dragNdc, camera);

      anchor.group.updateMatrixWorld(true);

      return true;

    }

    function screenToAnchorLocal(clientX, clientY, out) {

      if (!setRayFromScreen(clientX, clientY)) return false;

      dragPlaneNormal
        .set(0, 0, 1)
        .transformDirection(anchor.group.matrixWorld);

      dragPlanePoint.setFromMatrixPosition(anchor.group.matrixWorld);

      dragPlane.setFromNormalAndCoplanarPoint(
        dragPlaneNormal,
        dragPlanePoint
      );

      if (!dragRaycaster.ray.intersectPlane(dragPlane, dragHitPoint)) {
        return false;
      }

      out.copy(dragHitPoint);
      anchor.group.worldToLocal(out);

      return true;

    }

    // 두 손가락 이동 상태
    const dragPrevLocal = new THREE.Vector3();
    const dragCurrLocal = new THREE.Vector3();
    let dragHasPrev = false;
    let dragTargetGroup = null;

    // 3D 모델을 먼저 검사하고, 없으면 영상/이미지 배경을 검사
    function pickTargetAtPoint(clientX, clientY) {

      if (!setRayFromScreen(clientX, clientY)) return null;

      if (modelRoot) {

        const modelHits = dragRaycaster.intersectObject(
          modelMoveGroup,
          true
        );

        if (modelHits.length > 0) return "model";

      }

      // 이미지는 영상보다 앞에 있으므로 먼저 검사
      if (imageMesh) {

        const imageHits = dragRaycaster.intersectObject(
          imageMesh,
          false
        );

        if (imageHits.length > 0) return "image";

      }

      // 재생바 (영상 바로 아래)
      if (videoBar) {

        const barHits = dragRaycaster.intersectObject(
          videoBar.hit,
          false
        );

        if (barHits.length > 0) return "bar";

      }

      if (backgroundMesh) {

        const backgroundHits = dragRaycaster.intersectObject(
          backgroundMesh,
          false
        );

        if (backgroundHits.length > 0) return "background";

      }

      return null;

    }

    // 두 손가락이 "모두" 같은 대상 위에 있을 때만 그 대상 반환
    // 한 손가락씩 서로 다른 대상 위이거나, 하나라도 대상 밖이면 이동 안 함
    function pickDragTarget() {

      const points = Array.from(activePointers.values());

      if (points.length < 2) return null;

      const first = pickTargetAtPoint(points[0].x, points[0].y);
      const second = pickTargetAtPoint(points[1].x, points[1].y);

      if (!first || first !== second) return null;

      if (first === "model") return modelMoveGroup;
      if (first === "image") return imageMoveGroup;

      return backgroundMoveGroup;

    }

    touchArea.addEventListener("pointerdown", (e) => {

      // modelRoot가 없어도(영상/이미지만 있어도) 이동은 가능하도록
      if (!targetVisible) return;

      e.preventDefault();

      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      touchArea.setPointerCapture(e.pointerId);

      if (activePointers.size === 1) {

        previousX = e.clientX;
        previousY = e.clientY;

        // 터치 시작 지점의 대상 판별 및 탭 판정 시작
        singleStartTarget = pickTargetAtPoint(e.clientX, e.clientY);

        // 재생바를 누르면 그 위치로 바로 이동
        if (singleStartTarget === "bar") {
          seekVideoFromScreen(e.clientX, e.clientY);
        }

        tapCandidate = true;
        tapStartX = e.clientX;
        tapStartY = e.clientY;
        tapStartTime = performance.now();

      }

      if (activePointers.size === 2) {

        // 두 손가락이 되면 영상 탭 / 영상 재생 위치 이동 해제
        singleStartTarget = null;
        tapCandidate = false;

        pinchStartDistance = getPinchDistance();

        // 두 손가락 이동 시작 기준점
        const mid = getPinchMidpoint();

        // 두 손가락이 닿은 대상 판별 후, 대상이 있을 때만 이동 기준점 설정
        dragTargetGroup = pickDragTarget();

        // 핀치 시작 크기: 선택된 대상의 현재 크기
        if (dragTargetGroup === modelMoveGroup && modelRoot) {
          pinchStartScale = modelRoot.scale.x;
        } else if (dragTargetGroup === imageMoveGroup) {
          pinchStartScale = imageMoveGroup.scale.x;
        } else if (dragTargetGroup === backgroundMoveGroup) {
          pinchStartScale = backgroundMoveGroup.scale.x;
        } else {
          pinchStartScale = 1;
        }

        // 어떤 대상이 선택됐는지 상단 상태 문구로 표시
        if (dragTargetGroup === modelMoveGroup) {
          status.textContent = "이동 중: 오브젝트";
        } else if (dragTargetGroup === imageMoveGroup) {
          status.textContent = "이동 중: 이미지";
        } else if (dragTargetGroup === backgroundMoveGroup) {
          status.textContent = "이동 중: 영상";
        } else {
          status.textContent = "이동 대상 없음";
        }

        dragHasPrev = (mid && dragTargetGroup)
          ? screenToAnchorLocal(mid.x, mid.y, dragPrevLocal)
          : false;

      }

    });

    touchArea.addEventListener("pointermove", (e) => {

      if (!activePointers.has(e.pointerId)) return;

      e.preventDefault();

      activePointers.set(e.pointerId, {
        x: e.clientX,
        y: e.clientY
      });

      // 한 손가락: 영상 위에서 시작했으면 재생 위치 이동, 아니면 회전
      if (activePointers.size === 1) {

        // 일정 거리 이상 움직이면 탭이 아님
        if (tapCandidate) {

          const movedX = e.clientX - tapStartX;
          const movedY = e.clientY - tapStartY;

          if (Math.sqrt(movedX * movedX + movedY * movedY) > TAP_MOVE_LIMIT) {
            tapCandidate = false;
          }

        }

        if (singleStartTarget === "background") {

          // 영상 재생 위치 앞뒤 이동 
          if (
            !tapCandidate &&
            video &&
            videoReady &&
            !videoFailed &&
            Number.isFinite(video.duration) &&
            video.duration > 0
          ) {

            const deltaX = e.clientX - previousX;

            const seekSeconds =
              (deltaX / window.innerWidth) *
              video.duration *
              SEEK_SCREEN_WIDTH_RATIO;

            video.currentTime = THREE.MathUtils.clamp(
              video.currentTime + seekSeconds,
              0,
              video.duration
            );

          }

          previousX = e.clientX;
          previousY = e.clientY;

        } else if (singleStartTarget === "bar") {

          // 재생바 드래그: 손가락 위치로 재생 위치 이동
          seekVideoFromScreen(e.clientX, e.clientY);

          previousX = e.clientX;
          previousY = e.clientY;

        } else if (modelRoot) {

          const deltaX = e.clientX - previousX;
          const deltaY = e.clientY - previousY;

          modelRoot.rotation.y += deltaX * ROTATION_SPEED;
          modelRoot.rotation.x += deltaY * ROTATION_SPEED;

          previousX = e.clientX;
          previousY = e.clientY;

        }

      }

      // 두 손가락: 확대 / 축소 + 위치 이동
      else if (activePointers.size === 2) {

        // 확대 / 축소
        if (dragTargetGroup && pinchStartDistance > 0) {

          const currentDistance = getPinchDistance();

          const scaleRatio = currentDistance / pinchStartDistance;

          const newScale = pinchStartScale * scaleRatio;

          if (dragTargetGroup === modelMoveGroup && modelRoot) {

            // 오브젝트: 기존과 동일한 범위
            const clampedScale = THREE.MathUtils.clamp(
              newScale,
              initialFitScale * 0.1,
              initialFitScale * 10
            );

            modelRoot.scale.setScalar(clampedScale);

          } else if (dragTargetGroup === backgroundMoveGroup) {

            // 영상/이미지 배경: 초기 크기(1) 기준 
            const clampedScale = THREE.MathUtils.clamp(
              newScale,
              0.1,
              10
            );

            backgroundMoveGroup.scale.setScalar(clampedScale);

          } else if (dragTargetGroup === imageMoveGroup) {

            // 이미지: 초기 크기(1) 기준 
            const clampedScale = THREE.MathUtils.clamp(
              newScale,
              0.1,
              10
            );

            imageMoveGroup.scale.setScalar(clampedScale);

          }

        }

        // 위치 이동: 두 손가락 중간점이 움직인 만큼, 처음 닿은 대상만 이동
        const mid = getPinchMidpoint();

        if (mid && dragTargetGroup) {

          if (!dragHasPrev) {

            dragHasPrev = screenToAnchorLocal(mid.x, mid.y, dragPrevLocal);

          } else if (screenToAnchorLocal(mid.x, mid.y, dragCurrLocal)) {

            dragTargetGroup.position.x += dragCurrLocal.x - dragPrevLocal.x;
            dragTargetGroup.position.y += dragCurrLocal.y - dragPrevLocal.y;

            dragPrevLocal.copy(dragCurrLocal);

          }

        }

      }

    });

    function stopPointer(e) {

      if (!activePointers.has(e.pointerId)) return;

      // 영상 위를 한 손가락으로 톡 두드리면 재생 / 일시정지
      if (
        e.type === "pointerup" &&
        activePointers.size === 1 &&
        tapCandidate &&
        singleStartTarget === "background" &&
        performance.now() - tapStartTime < TAP_MAX_TIME
      ) {
        toggleVideoPlayback();
      }

      tapCandidate = false;
      singleStartTarget = null;

      activePointers.delete(e.pointerId);

      // 두 손가락 상태가 끝나면 이동 기준점 및 대상 해제
      dragHasPrev = false;
      dragTargetGroup = null;

      // 손가락을 떼면 상단 상태 문구 원복
      updateStatus();

      if (activePointers.size === 1) {

        const remaining = Array.from(activePointers.values())[0];

        previousX = remaining.x;
        previousY = remaining.y;

      } else if (activePointers.size === 0) {

        pinchStartDistance = 0;

      }

    }

    touchArea.addEventListener("pointerup", stopPointer);
    touchArea.addEventListener("pointercancel", stopPointer);
    touchArea.addEventListener("lostpointercapture", stopPointer);

  </script>

</body>
